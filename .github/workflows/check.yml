name: Scaffold checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Pinned toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check
        run: cargo xtask check
      - name: Optimized native build
        run: cargo xtask build --release
      - name: Local development artifact and notices
        run: cargo xtask package --output artifacts/package
      - name: Linux runtime imports
        if: runner.os == 'Linux'
        run: ldd artifacts/package/Lightwell/lightwell | tee artifacts/package/runtime-imports.txt
      - name: Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "MSVC dumpbin unavailable" }
          & $dumpbin.FullName /DEPENDENTS artifacts/package/Lightwell/lightwell.exe | Tee-Object artifacts/package/runtime-imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Headless Linux renderer smoke (software Vulkan, not native acceptance)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/fixture-requirements.txt
          .venv/bin/python tools/generate_fixtures.py --large
          for scenario in empty load replacement invalid repeated alternating large24 large60; do
            xvfb-run -a .venv/bin/python tools/dev.py smoke --binary artifacts/package/Lightwell/lightwell --scenario "$scenario" --output "artifacts/headless-$scenario"
          done
        env:
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
      - name: Retain development artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightwell-${{ matrix.os }}-development
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pinned fixture environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/fixture-requirements.txt
      - name: Verify fixture hashes, content and regeneration
        run: .venv/bin/python tools/dev.py fixtures

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pinned toolchain and audit tool
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo install --locked --version 0.20.2 --root .tools/cargo-deny cargo-deny
      - name: License, source and advisory policy
        run: cargo xtask audit
